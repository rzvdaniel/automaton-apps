<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ISS Tracker App Icon</title>
  <desc id="desc">Circular ISS Tracker icon with simplified ISS, aligned solar panels, stars, and Earth horizon.</desc>

  <defs>
    <radialGradient id="spaceGradient" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#071d40"/>
      <stop offset="65%" stop-color="#02122d"/>
      <stop offset="100%" stop-color="#000814"/>
    </radialGradient>

    <linearGradient id="panelGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#65a9ff"/>
      <stop offset="100%" stop-color="#2568c8"/>
    </linearGradient>

    <linearGradient id="earthGradient" x1="155" y1="760" x2="880" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4fa4ff"/>
      <stop offset="55%" stop-color="#2468c8"/>
      <stop offset="100%" stop-color="#102f68"/>
    </linearGradient>

    <filter id="earthGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <clipPath id="badgeClip">
      <circle cx="512" cy="512" r="466"/>
    </clipPath>
  </defs>

  <!-- Circular badge -->
  <circle cx="512" cy="512" r="500" fill="#000815"/>
  <circle cx="512" cy="512" r="470" fill="url(#spaceGradient)" stroke="#2d78df" stroke-width="16"/>

  <g clip-path="url(#badgeClip)">
    <!-- Stars, positioned away from station arms -->
    <g fill="#ffffff">
      <path d="M526 138 L535 169 L566 178 L535 187 L526 218 L517 187 L486 178 L517 169 Z"/>
    </g>

    <!-- Earth -->
    <path d="M132 850 C248 708 390 662 512 662 C634 662 776 708 892 850 L892 1024 L132 1024 Z" fill="url(#earthGradient)"/>

    <!-- Earth horizon glow -->
    <path d="M150 836 C265 706 392 668 512 668 C632 668 759 706 874 836"
          fill="none" stroke="#9eeeff" stroke-width="12" stroke-linecap="round" filter="url(#earthGlow)"/>

    <!-- Continents -->
    <g fill="#143b86" opacity="0.82">
      <path d="M210 827 C255 784 305 762 352 761 C382 760 412 739 434 749 C451 757 419 774 397 780 C430 779 464 755 482 772 C493 784 463 803 437 811 C394 824 372 834 334 820 C302 808 270 837 232 853 C208 863 190 845 210 827Z"/>
      <path d="M520 835 C549 801 589 790 618 805 C642 818 653 842 683 838 C714 834 740 809 773 816 C812 824 839 853 864 881 C814 891 749 888 707 866 C665 843 630 861 591 866 C556 870 526 859 520 835Z"/>
      <path d="M426 922 C467 901 523 896 559 918 C589 936 633 936 670 925 C645 957 590 968 540 954 C491 941 455 944 426 922Z"/>
    </g>

    <!-- Simplified ISS -->
    <g filter="url(#softShadow)">
      <!-- Left solar panels -->
      <g>
        <rect x="198" y="288" width="70" height="184" rx="6" fill="url(#panelGradient)"/>
        <rect x="282" y="288" width="70" height="184" rx="6" fill="url(#panelGradient)"/>
        <rect x="198" y="488" width="70" height="174" rx="6" fill="url(#panelGradient)"/>
        <rect x="282" y="488" width="70" height="174" rx="6" fill="url(#panelGradient)"/>

        <!-- centered arm supports -->
        <rect x="218" y="472" width="20" height="16" rx="1" fill="#f3f7fb"/>
        <rect x="306" y="472" width="20" height="16" rx="1" fill="#f3f7fb"/>
      </g>

      <!-- Right solar panels -->
      <g>
        <rect x="672" y="288" width="70" height="184" rx="6" fill="url(#panelGradient)"/>
        <rect x="756" y="288" width="70" height="184" rx="6" fill="url(#panelGradient)"/>
        <rect x="672" y="488" width="70" height="174" rx="6" fill="url(#panelGradient)"/>
        <rect x="756" y="488" width="70" height="174" rx="6" fill="url(#panelGradient)"/>

        <!-- centered arm supports -->
        <rect x="696" y="472" width="20" height="16" rx="1" fill="#f3f7fb"/>
        <rect x="780" y="472" width="20" height="16" rx="1" fill="#f3f7fb"/>
      </g>

      <!-- Tiny side nubs -->
      <rect x="360" y="472" width="7" height="18" rx="1" fill="#f6f8fb"/>
      <rect x="657" y="472" width="7" height="18" rx="1" fill="#f6f8fb"/>

      <!-- Side modules -->
      <rect x="370" y="450" width="34" height="64" rx="5" fill="#f8fafc"/>
      <rect x="620" y="450" width="34" height="64" rx="5" fill="#f8fafc"/>

      <!-- Arms, centered on panels -->
      <rect x="404" y="468" width="120" height="28" rx="5" fill="#f8fafc"/>
      <rect x="500" y="468" width="120" height="28" rx="5" fill="#f8fafc"/>

      <!-- Center module -->
      <rect x="484" y="424" width="56" height="90" rx="8" fill="#f8fafc"/>
      <rect x="499" y="382" width="26" height="54" rx="13" fill="#f8fafc"/>

      <!-- Bottom module -->
      <rect x="448" y="524" width="128" height="36" rx="5" fill="#f8fafc"/>
      <rect x="494" y="558" width="36" height="42" rx="5" fill="#f8fafc"/>
    </g>
  </g>

  <!-- Top border highlight -->
  <circle cx="512" cy="512" r="470" fill="none" stroke="#4693ff" stroke-width="5" opacity="0.9"/>
</svg>
