<!doctype html>
<html lang="en" data-look="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agent Keeper</title>
<link rel="stylesheet" href="ui/app.css">
<link rel="stylesheet" href="keeper.css">
<script src="ui/app.js"></script>
</head>
<body>
<header class="a-topbar">
  <div class="a-topbar__inner">
    <div class="a-header__brand">
      <svg class="a-brand" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10"/><path d="M10 15l5 4-5 4M30 15l-5 4 5 4M17 27h6"/></svg>
      <h1 class="a-header__title">Agent Keeper</h1>
    </div>
    <div class="tabs" role="tablist" aria-label="Agent Keeper">
      <button type="button" class="tab" role="tab" id="tab-queue" data-tab="queue">Queue <span class="tab-n" id="tab-n" hidden></span></button>
      <button type="button" class="tab" role="tab" id="tab-machine" data-tab="machine">Machine</button>
      <button type="button" class="tab" role="tab" id="tab-setup" data-tab="setup">Setup</button>
    </div>
    <div class="a-header__actions">
      <span class="a-header__sub" id="subtitle">Loading</span>
      <span class="a-pill a-pill--large" id="overall" hidden></span>
      <button class="a-btn a-btn--icon" type="button" data-theme-toggle aria-label="Switch light or dark theme">&#9680;</button>
    </div>
  </div>
</header>
<main class="a-page">
  <div id="view"></div>
</main>
<script src="keeper.js"></script>
</body>
</html>
