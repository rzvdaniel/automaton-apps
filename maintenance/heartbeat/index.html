<!doctype html>
<html lang="en" data-look="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heartbeat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="ui/app.css">
<link rel="stylesheet" href="heartbeat.css">
<script src="ui/app.js"></script>
</head>
<body>
<header class="a-topbar"><div class="a-topbar__inner">
  <div style="display:flex;gap:12px;align-items:center"><div class="a-brand" aria-hidden="true">&gt;_</div>
    <div><h1 class="a-header__title">Heartbeat</h1><p class="a-header__sub">Check-ins for scheduled jobs</p></div></div>
  <div class="a-header__actions"><button class="a-btn a-btn--icon" type="button" data-theme-toggle aria-label="Switch light or dark theme">&#9680;</button></div>
</div></header>
<main class="a-page">
  <section class="a-waiting" id="login-card"><h2 class="a-waiting__title">Sign in to manage checks</h2>
    <form id="login" class="a-form"><div class="a-field"><label class="a-label" for="token">Admin token</label><input class="a-input" id="token" type="password" placeholder="Admin token" autocomplete="current-password" required></div><button class="a-btn a-btn--primary">Sign in</button></form>
  </section>
  <p id="message" class="a-note a-note--critical" hidden></p>
  <section id="app" class="a-stack" hidden>
    <section class="a-card"><div class="a-card__head"><h2 class="a-card__title">Create check</h2></div>
      <form id="create" class="a-form a-form--checks">
        <div class="a-field"><label class="a-label" for="name">Name</label><input class="a-input" id="name" placeholder="e.g. db-dump" maxlength="80" required></div>
        <div class="a-field"><label class="a-label" for="period">Every</label><input class="a-input" id="period" placeholder="e.g. 24h" required></div>
        <div class="a-field"><label class="a-label" for="grace">Grace</label><input class="a-input" id="grace" placeholder="e.g. 1h"></div>
        <button class="a-btn a-btn--primary">Create check</button>
      </form>
    </section>
    <section class="a-card"><div class="a-card__head"><h2 class="a-card__title">Checks</h2></div><div class="a-table-wrap">
      <table class="a-table"><thead><tr><th>Name</th><th>Status</th><th>Every</th><th>Grace</th><th>Last check-in</th><th>Check-in URL</th><th></th></tr></thead><tbody id="rows"></tbody></table>
    </div><p class="a-card__foot">Your job calls the check-in URL (GET or POST) after each run, for example <code>curl -fsS URL</code>. Anyone with the URL can check in for that job; keep it private.</p></section>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const secs = n => n < 60 ? n + 's' : [[86400,'d'],[3600,'h'],[60,'m']].reduce((o, [s, u]) => { const k = Math.floor(n / s); n -= k * s; return k ? o + k + u + ' ' : o; }, '').trim();
async function api(method, path, body) {
  const response = await fetch('/api/checks' + path, { method, headers: { Authorization: 'Bearer ' + sessionStorage.getItem('token'), 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  if (response.status === 401 || response.status === 503) { sessionStorage.removeItem('token'); $('app').hidden = true; $('login-card').hidden = false; }
  if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || 'Request failed (' + response.status + ')');
  return response.status === 204 ? null : response.json();
}
async function refresh() {
  try {
    const checks = await api('GET', '');
    $('message').textContent = ''; $('message').hidden = true; $('login-card').hidden = true; $('app').hidden = false;
    const rows = $('rows'); rows.replaceChildren();
    for (const c of checks) {
      const tr = rows.insertRow();
      tr.insertCell().textContent = c.name;
      const st = tr.insertCell(); const pill = document.createElement('span'); pill.textContent = c.status === 'late' ? 'LATE' : c.status === 'new' ? 'Waiting' : 'OK'; pill.className = 'a-pill a-pill--' + (c.status === 'late' ? 'critical' : c.status === 'new' ? 'warning' : 'ok'); st.append(pill);
      tr.insertCell().textContent = secs(c.period); tr.insertCell().textContent = secs(c.grace) || '0';
      tr.insertCell().textContent = c.last_ping ? new Date(c.last_ping * 1000).toLocaleString() : 'never';
      const input = document.createElement('input'); input.className = 'a-input check-url'; input.readOnly = true; input.value = location.origin + '/ping/' + c.token;
      input.onfocus = () => input.select();
      const copy = document.createElement('button'); copy.type = 'button'; copy.className = 'a-btn'; copy.textContent = 'Copy'; copy.setAttribute('aria-label', 'Copy check-in URL of ' + c.name);
      copy.onclick = async () => {
        try { await navigator.clipboard.writeText(input.value); } catch { input.select(); document.execCommand('copy'); }
        copy.textContent = 'Copied'; setTimeout(() => { copy.textContent = 'Copy'; }, 1500);
      };
      const cell = tr.insertCell(); cell.className = 'check-url-cell'; cell.append(input, copy);
      const del = document.createElement('button'); del.className = 'a-btn'; del.textContent = 'Delete';
      del.onclick = async () => { if (confirm('Delete check ' + c.name + '?')) { try { await api('DELETE', '/' + c.id); refresh(); } catch (e) { $('message').textContent = e.message; $('message').hidden = false; } } };
      tr.insertCell().append(del);
    }
  } catch (e) { $('message').textContent = e.message; $('message').hidden = false; }
}
$('login').onsubmit = e => { e.preventDefault(); sessionStorage.setItem('token', $('token').value); $('token').value = ''; refresh(); };
$('create').onsubmit = async e => {
  e.preventDefault();
  try { await api('POST', '', { name: $('name').value, period: $('period').value, grace: $('grace').value }); e.target.reset(); refresh(); }
  catch (err) { $('message').textContent = err.message; $('message').hidden = false; }
};
AutomatonUI.bindThemeToggle();
if (sessionStorage.getItem('token')) refresh();
setInterval(() => sessionStorage.getItem('token') && refresh(), 30000);
</script>
</body>
</html>
