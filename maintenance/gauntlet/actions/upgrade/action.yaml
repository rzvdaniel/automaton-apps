apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Upgrade
  key: upgrade
  description: Starts Gauntlet's upgrade plan in the app; its report and step logs show in the app's Reports.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 60
  schedulable: true
  allowedExecutionScopes:
    - AppRunner
  defaultConcurrencyPolicy: SkipIfRunning
  input:
    type: object
    properties:
      version:
        type: string
  output:
    type: object
    properties:
      plan:
        type: string
      run:
        type: integer
