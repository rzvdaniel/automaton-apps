apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Smoke test
  key: smoke
  description: Starts Gauntlet's smoke plan in the app; its report and step logs show in the app's Reports.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 60
  schedulable: true
  allowedExecutionScopes:
    - AppRunner
  defaultConcurrencyPolicy: SkipIfRunning
  output:
    type: object
    properties:
      plan:
        type: string
      run:
        type: integer
