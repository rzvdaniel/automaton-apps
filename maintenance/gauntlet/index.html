<!doctype html>
<html lang="en" data-look="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gauntlet</title>
<link rel="stylesheet" href="ui/app.css">
<link rel="stylesheet" href="gauntlet.css">
<script src="ui/app.js"></script>
</head>
<body>
<header class="a-topbar"><div class="a-topbar__inner">
  <div style="display:flex;gap:12px;align-items:center"><div class="a-brand" aria-hidden="true">&gt;_</div>
    <div><h1 class="a-header__title">Gauntlet</h1><p class="a-header__sub">Install, use, uninstall and reinstall tests</p></div></div>
  <div class="a-header__actions"><button class="a-btn a-btn--icon" type="button" data-theme-toggle aria-label="Switch light or dark theme">&#9680;</button></div>
</div></header>
<main class="a-page">
  <p id="message" class="a-note a-note--critical" hidden></p>
  <section id="app" class="a-stack">
    <section class="a-card"><div class="a-card__head"><h2 class="a-card__title">Plans</h2></div><div class="a-table-wrap">
      <table class="a-table"><thead><tr><th>Plan</th><th>Machine</th><th>Last result</th><th></th></tr></thead><tbody id="plans"></tbody></table>
    </div><p id="setup" class="a-card__foot"></p></section>
    <section class="a-card"><div class="a-card__head"><h2 class="a-card__title">Reports</h2></div><div class="a-table-wrap">
      <table class="a-table"><thead><tr><th>Run</th><th>Plan</th><th>Result</th><th>Started (UTC)</th><th>Took</th></tr></thead><tbody id="runs"></tbody></table>
    </div></section>
    <section class="a-card" id="detail" hidden><div class="a-card__head"><h2 class="a-card__title" id="detail-title"></h2></div><div class="a-table-wrap">
      <table class="a-table"><thead><tr><th>Step</th><th>Result</th><th>Took</th><th>Why</th><th>Log</th></tr></thead><tbody id="steps"></tbody></table>
    </div></section>
  </section>
</main>
<script src="gauntlet.js"></script>
</body>
</html>
