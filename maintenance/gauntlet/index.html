<!doctype html>
<html lang="en" data-look="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gauntlet</title>
<link rel="stylesheet" href="ui/app.css">
<link rel="stylesheet" href="gauntlet.css">
<script src="ui/app.js"></script>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1>Gauntlet</h1>
      <p class="sub">Install, use and wipe Automaton on test machines, and tell you what breaks before a release reaches users.</p>
    </div>
    <button class="btn" type="button" data-theme-toggle aria-label="Switch light or dark theme">&#9680;</button>
  </header>
  <p id="message" class="note note--bad" hidden></p>
  <p id="mode" class="note"></p>
  <p id="machines" class="chips" aria-label="Machines"></p>
  <section class="panel" aria-labelledby="plans-title">
    <h2 id="plans-title">Plans</h2>
    <p class="foot">Open a plan to see its last 5 runs; open a run to see its steps. A plan whose last run failed opens with that run.</p>
    <div id="plans" class="plans"></div>
  </section>
  <p id="setup" class="foot"></p>
</div>
<script src="gauntlet.js"></script>
</body>
</html>
