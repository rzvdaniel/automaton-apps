<!doctype html>
<html lang="en" data-look="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gauntlet</title>
<link rel="stylesheet" href="ui/app.css">
<link rel="stylesheet" href="gauntlet.css">
<script src="ui/app.js"></script>
</head>
<body>
<header class="a-topbar"><div class="a-topbar__inner">
  <div style="display:flex;gap:12px;align-items:center"><div class="a-brand" aria-hidden="true">&gt;_</div>
    <div><h1 class="a-header__title">Gauntlet</h1><p class="a-header__sub">Install, use, uninstall and reinstall tests</p></div></div>
  <div class="a-header__actions"><button class="a-btn a-btn--icon" type="button" data-theme-toggle aria-label="Switch light or dark theme">&#9680;</button></div>
</div></header>
<main class="a-page">
  <p id="message" class="a-note a-note--critical" hidden></p>
  <section id="app" class="a-stack">
    <p id="mode" class="a-note"></p>
    <p id="machines" class="chips" aria-label="Machines"></p>
    <section class="a-card"><div class="a-card__head"><h2 class="a-card__title">Plans</h2></div>
      <ul id="plans" class="plans"></ul>
      <p id="setup" class="a-card__foot"></p></section>
  </section>
</main>
<script src="gauntlet.js"></script>
</body>
</html>
