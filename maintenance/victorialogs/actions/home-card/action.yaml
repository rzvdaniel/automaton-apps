apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Home card
  key: home-card
  description: Log counters, 24 hour volume chart and storage meter for the Home card.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 60
  schedulable: true
  allowedExecutionScopes:
    - AppRunner
  defaultConcurrencyPolicy: SkipIfRunning
  output:
    type: object
    properties:
      status:
        type: string
      tone:
        type: string
      blocks:
        type: array
