<!doctype html>
<html lang="en" data-look="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overseer</title>
<link rel="stylesheet" href="ui/app.css">
<link rel="stylesheet" href="overseer.css">
<script src="ui/app.js"></script>
</head>
<body>
<header class="a-topbar"><div class="a-topbar__inner">
  <div style="display:flex;gap:12px;align-items:center"><div class="a-brand" aria-hidden="true">&#9679;</div>
    <div><h1 class="a-header__title">Overseer</h1><p class="a-header__sub">Your coding agents' queue and schedules</p></div></div>
  <div class="a-header__actions"><button class="a-btn a-btn--icon" type="button" data-theme-toggle aria-label="Switch light or dark theme">&#9680;</button></div>
</div></header>
<main class="a-page">
  <p id="message" class="a-note a-note--critical" hidden></p>
  <section class="a-stack">
    <section class="a-card"><div class="a-card__head"><h2 class="a-card__title">Usage per day</h2></div>
      <div class="a-table-wrap"><table class="a-table"><thead><tr><th>Day (UTC)</th><th>Runner</th><th>Tasks</th><th>Input</th><th>Output</th><th>Cost</th></tr></thead><tbody id="usage"></tbody></table></div></section>
    <section class="a-card"><div class="a-card__head"><h2 class="a-card__title">Queue</h2>
      <div class="actions"><span id="worker"></span><button class="a-btn" id="pause" type="button"></button></div></div>
      <div class="a-table-wrap"><table class="a-table"><thead><tr><th>Task</th><th>State</th><th></th></tr></thead><tbody id="tasks"></tbody></table></div>
      <form id="add" class="a-card__foot a-stack">
        <label>Task name <input id="name" class="a-input" maxlength="80" required pattern="[A-Za-z0-9._-]+" placeholder="fix-login-344"></label>
        <label>What the agent should do <textarea id="prompt" class="a-input" rows="3" maxlength="8000" required></textarea></label>
        <div><button class="a-btn a-btn--primary" type="submit">Add task</button></div>
      </form></section>
    <section class="a-card" id="detail" hidden><div class="a-card__head"><h2 class="a-card__title" id="detail-title"></h2></div>
      <p id="detail-links" class="a-card__foot"></p><pre class="log a-card" id="detail-log"></pre></section>
    <section class="a-card"><div class="a-card__head"><h2 class="a-card__title">Schedules</h2></div><div class="a-table-wrap">
      <table class="a-table"><thead><tr><th>Job</th><th>Last run (UTC)</th><th>Result</th><th></th></tr></thead><tbody id="jobs"></tbody></table></div>
      <p id="schedule" class="a-card__foot"></p></section>
    <section class="a-card"><div class="a-card__head"><h2 class="a-card__title">Latest morning report</h2></div><pre class="log a-card" id="report"></pre></section>
  </section>
</main>
<script src="overseer.js"></script>
</body>
</html>
