apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Release check
  key: release-check
  description: Upgrades the test server to a new server release and queues its release check. Start it from the server-release workflow with a webhook.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 60
  schedulable: false
  allowedExecutionScopes:
    - AppRunner
  defaultConcurrencyPolicy: SkipIfRunning
  input:
    type: object
    required:
      - version
    properties:
      version:
        type: string
  output:
    type: object
    properties:
      ok:
        type: boolean
      text:
        type: string
