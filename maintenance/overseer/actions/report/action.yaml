apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Morning report
  key: report
  description: Writes the morning report from the queue's finished tasks.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 180
  schedulable: true
  allowedExecutionScopes:
    - AppRunner
  defaultConcurrencyPolicy: SkipIfRunning
  output:
    type: object
    properties:
      ok:
        type: boolean
      text:
        type: string
