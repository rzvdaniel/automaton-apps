apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Pick-up
  key: pick-up
  description: Queues the open issues in the Ready for agents column of each board Overseer lists.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 180
  schedulable: true
  allowedExecutionScopes:
    - AppRunner
  defaultConcurrencyPolicy: SkipIfRunning
  output:
    type: object
    properties:
      ok:
        type: boolean
      text:
        type: string
