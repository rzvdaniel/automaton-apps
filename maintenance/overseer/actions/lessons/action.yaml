apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Lessons
  key: lessons
  description: Queues a task that works through the lessons inbox.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 180
  schedulable: true
  allowedExecutionScopes:
    - AppRunner
  defaultConcurrencyPolicy: SkipIfRunning
  output:
    type: object
    properties:
      ok:
        type: boolean
      text:
        type: string
