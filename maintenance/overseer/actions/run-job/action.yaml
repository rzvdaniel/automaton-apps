apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Run job
  key: run-job
  description: Runs one of Overseer's jobs (stall-check, report, lessons, pick-up) in the app.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 180
  schedulable: true
  allowedExecutionScopes:
    - AppRunner
  defaultConcurrencyPolicy: SkipIfRunning
  input:
    type: object
    required:
      - job
    properties:
      job:
        type: string
  output:
    type: object
    properties:
      ok:
        type: boolean
      text:
        type: string
