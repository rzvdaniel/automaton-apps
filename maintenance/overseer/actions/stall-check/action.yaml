apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Stall check
  key: stall-check
  description: Checks the queue for tasks that stopped writing to their log and acts on the stalled ones.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 180
  schedulable: true
  allowedExecutionScopes:
    - AppRunner
  defaultConcurrencyPolicy: SkipIfRunning
  output:
    type: object
    properties:
      ok:
        type: boolean
      text:
        type: string
