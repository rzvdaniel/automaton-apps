apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Set up machine
  key: setup-machine
  description: Installs or updates the agent-machine scripts, the worker service and the cron entries on the queue machine, and reports whether claude, gh and git are signed in.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 180
  schedulable: false
  allowedExecutionScopes:
    - AppRunner
  defaultConcurrencyPolicy: SkipIfRunning
  output:
    type: object
    properties:
      ok:
        type: boolean
      text:
        type: string
