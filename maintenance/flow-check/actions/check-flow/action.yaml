apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Check delivery flow
  key: check-flow
  description: Check that an issue went through review, tests, CI, proof and production; nightly, label and comment on gaps.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 900
  schedulable: true
  allowedExecutionScopes:
    - AppRunner
  defaultConcurrencyPolicy: SkipIfRunning
  input:
    type: object
    properties:
      issue:
        type: integer
        description: Check this issue only; empty checks recently closed issues.
  output:
    type: object
    properties:
      mode:
        type: string
      issues:
        type: array
