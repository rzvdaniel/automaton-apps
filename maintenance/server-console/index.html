<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Server Console</title>
<link rel="stylesheet" href="ui/app.css">
<script src="ui/app.js"></script>
</head>
<body>
<main class="a-page">
  <header class="a-header">
    <div class="a-brand" aria-hidden="true">&gt;_</div>
    <div class="a-header__text">
      <h1 class="a-header__title">Server Console</h1>
      <p class="a-header__sub" id="subtitle">Loading</p>
    </div>
    <div class="a-header__actions">
      <span class="a-pill a-pill--large" id="overall" hidden></span>
      <button class="a-btn a-btn--icon" type="button" data-theme-toggle aria-label="Switch light or dark theme">&#9680;</button>
    </div>
  </header>
  <div id="view"></div>
  <p class="a-footer">Read-only. Figures come from your Automaton server and refresh every few minutes.</p>
</main>
<script src="dashboard.js"></script>
</body>
</html>
