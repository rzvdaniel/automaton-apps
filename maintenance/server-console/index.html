<!doctype html>
<html lang="en" data-look="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Server Keeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="ui/app.css">
<link rel="stylesheet" href="console.css">
<script src="ui/app.js"></script>
</head>
<body>
<header class="a-topbar sk-top">
  <div class="a-topbar__inner">
    <div class="a-header__brand">
      <div class="a-brand" aria-hidden="true">&gt;_</div>
      <h1 class="a-header__title">Server Keeper</h1>
    </div>
    <div class="tabs" role="tablist" aria-label="Server Keeper" id="tabs">
      <button type="button" class="tab is-on" role="tab" id="tab-overview" data-tab="overview" aria-selected="true" aria-controls="panel-overview">Overview</button>
      <button type="button" class="tab" role="tab" id="tab-maintenance" data-tab="maintenance" aria-selected="false" aria-controls="panel-maintenance" tabindex="-1">Maintenance</button>
      <button type="button" class="tab" role="tab" id="tab-apps" data-tab="apps" aria-selected="false" aria-controls="panel-apps" tabindex="-1">Apps on this machine</button>
    </div>
    <div class="a-header__actions">
      <span class="a-header__sub" id="subtitle">Loading</span>
      <button class="a-btn a-btn--icon" type="button" data-theme-toggle aria-label="Switch light or dark theme">&#9680;</button>
    </div>
  </div>
</header>
<main class="a-page sk">
  <div id="os-banner" hidden></div>
  <nav class="picker" id="machines" aria-label="Machines" hidden></nav>
  <div id="session-ended" class="a-note a-note--warning" role="alert" hidden>Session ended. <a href="" id="session-signin">Sign in again</a> to refresh these figures.</div>
  <section class="panel is-on" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview">
    <div id="view"></div>
  </section>
  <section class="panel" id="panel-maintenance" role="tabpanel" aria-labelledby="tab-maintenance" hidden>
    <div class="maint">
      <div class="maint__main">
        <div id="tasks-box" hidden></div>
      </div>
      <aside class="maint__runs" id="runs-box" aria-label="Recent runs"></aside>
    </div>
  </section>
  <section class="panel" id="panel-apps" role="tabpanel" aria-labelledby="tab-apps" hidden>
    <div id="apps-box"></div>
  </section>
  <p class="a-footer">Measured by the Runner every few minutes.</p>
</main>
<script src="dashboard.js"></script>
</body>
</html>
