apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Home card
  key: home-card
  description: The card Studio Home shows for Gate Keeper, with the bans now, in the last hour and 24 hours, and the busiest jails.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 25
  schedulable: false
  allowedExecutionScopes:
    - AppRunner
  defaultConcurrencyPolicy: SkipIfRunning
  output:
    type: object
    required:
      - status
    properties:
      status:
        type: string
