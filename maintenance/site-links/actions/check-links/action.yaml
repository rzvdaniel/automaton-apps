apiVersion: automaton.dev/v1
kind: Action
metadata:
  name: Check site links
  key: check-links
  description: Crawl configured public sites and maintain one GitHub issue per site with broken links.
spec:
  runtime: python
  entrypoint: main.py
  timeoutSeconds: 3600
  schedulable: true
  allowedExecutionScopes:
    - AppRunner
  defaultConcurrencyPolicy: SkipIfRunning
  output:
    type: object
    properties:
      sites:
        type: array
      pagesChecked:
        type: integer
