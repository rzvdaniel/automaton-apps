<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <p class="eyebrow">Automaton + SQLite</p>
        <h1>Todo List</h1>
        <p class="hero-copy">A simple task tracker backed by an Automaton Python controller with SQLite persistence.</p>
      </header>

      <main class="board">
        <section class="composer card">
          <form id="todo-form" class="todo-form">
            <label class="sr-only" for="todo-title">Task title</label>
            <input id="todo-title" name="title" type="text" maxlength="120" placeholder="Add a task" required />
            <button type="submit">Add</button>
          </form>
          <p id="status-banner" class="status-banner" hidden></p>
        </section>

        <section class="summary-grid">
          <article class="card metric">
            <span class="metric-label">Total</span>
            <strong id="total-count">0</strong>
          </article>
          <article class="card metric">
            <span class="metric-label">Active</span>
            <strong id="active-count">0</strong>
          </article>
          <article class="card metric">
            <span class="metric-label">Done</span>
            <strong id="completed-count">0</strong>
          </article>
        </section>

        <section class="card">
          <div class="toolbar">
            <h2>Tasks</h2>
            <button id="clear-completed" class="ghost-button" type="button">Clear completed</button>
          </div>
          <ul id="todo-list" class="todo-list"></ul>
          <template id="todo-item-template">
            <li class="todo-item">
              <label class="todo-toggle">
                <input class="toggle-input" type="checkbox" />
                <span class="checkmark"></span>
              </label>
              <span class="todo-text"></span>
              <button class="delete-button" type="button" aria-label="Delete task">Delete</button>
            </li>
          </template>
        </section>
      </main>
    </div>
  </body>
</html>
