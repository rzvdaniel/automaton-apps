name: Harbour tests

on:
  pull_request:
    paths:
      - 'wallpapers/harbour/**'
      - '.github/workflows/harbour-tests.yml'
  push:
    paths:
      - 'wallpapers/harbour/**'
      - '.github/workflows/harbour-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallpapers/harbour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test "test/*.test.mjs"
