name: Pac-Man Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'pac-man/**'
      - '.github/workflows/pac-man-build.yml'
  pull_request:
    paths:
      - 'pac-man/**'
      - '.github/workflows/pac-man-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pac-man

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pac-man/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: pac-man-dist
          path: pac-man/dist
          if-no-files-found: error
