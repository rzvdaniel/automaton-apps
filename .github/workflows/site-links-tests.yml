name: Site links Action tests

on:
  pull_request:
    paths:
      - 'maintenance/site-links/**'
      - '.github/workflows/site-links-tests.yml'
  push:
    paths:
      - 'maintenance/site-links/**'
      - '.github/workflows/site-links-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maintenance/site-links/actions/check-links
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -p 'test_*.py'
