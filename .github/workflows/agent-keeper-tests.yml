name: Agent Keeper tests

on:
  pull_request:
    paths:
      - 'maintenance/agent-keeper/**'
      - 'design/automaton-app-ui/**'
      - '.github/workflows/agent-keeper-tests.yml'
  push:
    paths:
      - 'maintenance/agent-keeper/**'
      - 'design/automaton-app-ui/**'
      - '.github/workflows/agent-keeper-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maintenance/agent-keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -p 'test_*.py'
      - run: python ../../tools/check_vendored_ui.py
      - name: Build into dist/ and start it
        run: python tools/smoke_build.py maintenance/agent-keeper
        working-directory: .
