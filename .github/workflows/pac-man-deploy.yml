name: Pac-Man Deploy (Public Automaton)

on:
  workflow_dispatch:
    

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pac-man

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pac-man/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy to Automaton
        run: npm run deploy
        env:
          AUTOMATON_SERVER: ${{ secrets.AUTOMATON_SERVER }}
          AUTOMATON_APP_ID: ${{ secrets.AUTOMATON_APP_ID }}
          AUTOMATON_API_KEY: ${{ secrets.AUTOMATON_API_KEY }}
