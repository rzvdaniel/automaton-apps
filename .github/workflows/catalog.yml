name: Catalog

# catalog.json is the index every Automaton server reads. Pull requests check that every entry is valid;
# a merge to main regenerates it (each app is pinned to the last commit that changed its folder) and verifies it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Check every entry (pull request)
        if: github.event_name == 'pull_request'
        run: python tools/generate_catalog.py --validate
      - name: Regenerate and publish (main)
        if: github.event_name == 'push'
        run: |
          python tools/generate_catalog.py
          if ! git diff --quiet -- catalog.json || [ -n "$(git ls-files --others --exclude-standard catalog.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog.json
            git commit -m "Update catalog.json"
            git push
          fi
          python tools/generate_catalog.py --check
