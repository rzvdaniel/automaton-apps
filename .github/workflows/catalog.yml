name: Catalog

# catalog.json (in main) is the index every Automaton server reads. Pull requests check that every entry is valid.
# A merge to main regenerates it (each app is pinned to the last commit that changed its folder). When the file
# changed, a bot opens a pull request labelled catalog-bot and merges it (main requires pull requests, so a workflow
# cannot push there). No loop: pull requests and pushes made with the built-in token start no workflow, and if one
# ever did (a different token), the regenerated file would be identical and no pull request would be opened.
# Servers on 0.2.32 still read the `catalog` branch, so it is published as well until they are gone.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Publishing runs one at a time and in order, so an older run cannot overwrite a newer catalog.
concurrency:
  group: catalog-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Check vendored UI kit copies
        run: python tools/check_vendored_ui.py
      # Pinned release (install.sh checks its sha256); bump on purpose. Token withheld from the installer.
      - name: Install the Automaton CLI (pull request)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ''
          AUTOMATON_VERSION: server-v0.2.121
        run: curl -fsSL "https://github.com/rzvdaniel/automaton/releases/download/${AUTOMATON_VERSION}/install.sh" | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate changed app manifests with the server's rules (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python tools/validate_apps.py --changed-since "origin/${BASE_REF}"
      - name: Check every entry (pull request)
        if: github.event_name == 'pull_request'
        run: python tools/generate_catalog.py --validate
      - name: Regenerate catalog.json (main)
        if: github.event_name == 'push'
        run: python tools/generate_catalog.py --out "$RUNNER_TEMP/catalog.json"
      - name: Update catalog.json in main through a merged pull request (main)
        if: github.event_name == 'push'
        run: |
          echo "VERIFY_REF=${GITHUB_SHA}" >> "$GITHUB_ENV"
          if cmp -s "$RUNNER_TEMP/catalog.json" catalog.json; then
            echo "catalog.json is current; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c catalog-bot/update
          cp "$RUNNER_TEMP/catalog.json" catalog.json
          git add catalog.json
          git commit -q -m "Update catalog.json for ${GITHUB_SHA::7}"
          git push -q --force origin catalog-bot/update
          number=$(gh pr list --head catalog-bot/update --state open --json number -q '.[0].number')
          if [ -z "$number" ]; then
            url=$(gh pr create --base main --head catalog-bot/update --label catalog-bot \
              --title "Update catalog.json" --body "Generated by CI from ${GITHUB_SHA}. Merged automatically.")
            number=${url##*/}
          fi
          git switch -q --detach "$GITHUB_SHA"
          gh pr merge "$number" --squash --delete-branch
          echo "VERIFY_REF=$(gh pr view "$number" --json mergeCommit -q .mergeCommit.oid)" >> "$GITHUB_ENV"
      - name: Publish to the catalog branch for servers on 0.2.32 (main)
        if: github.event_name == 'push'
        run: |
          mkdir "$RUNNER_TEMP/catalog"
          cp "$RUNNER_TEMP/catalog.json" "$RUNNER_TEMP/catalog/catalog.json"
          cd "$RUNNER_TEMP/catalog"
          git init -q -b catalog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -q -m "catalog.json generated from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" catalog
      - name: Verify main and the catalog branch hold the generated catalog (main)
        if: github.event_name == 'push'
        run: |
          git fetch -q origin main catalog
          # main is checked at this run's own commit (or its bot merge), so a later merge cannot fail this run.
          for ref in "$VERIFY_REF" origin/catalog; do
            git show "$ref:catalog.json" > "$RUNNER_TEMP/published.json"
            python tools/generate_catalog.py --check "$RUNNER_TEMP/published.json"
          done
