name: Overseer tests

on:
  pull_request:
    paths:
      - 'maintenance/overseer/**'
      - '.github/workflows/overseer-tests.yml'
  push:
    paths:
      - 'maintenance/overseer/**'
      - '.github/workflows/overseer-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maintenance/overseer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -p 'test_*.py'
      - run: python -m unittest discover -p 'test_*.py' -s actions
      - run: python -m unittest discover -p 'test_*.py' -s actions/release-check
      - run: bash agent-machine/test.sh
      - name: Build into dist/ and start it
        run: python tools/smoke_build.py QUEUE_HOST=smoke@127.0.0.1 maintenance/overseer
        working-directory: .
