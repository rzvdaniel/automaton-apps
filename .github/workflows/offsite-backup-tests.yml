name: Off-site backup Action tests

on:
  pull_request:
    paths:
      - 'maintenance/offsite-backup/**'
      - '.github/workflows/offsite-backup-tests.yml'
  push:
    paths:
      - 'maintenance/offsite-backup/**'
      - '.github/workflows/offsite-backup-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maintenance/offsite-backup/actions/upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -p 'test_*.py'
