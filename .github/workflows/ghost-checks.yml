name: Ghost checks

on:
  pull_request:
    paths:
      - 'publishing/ghost/**'
      - '.github/workflows/ghost-checks.yml'
  push:
    paths:
      - 'publishing/ghost/**'
      - '.github/workflows/ghost-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: publishing/ghost
    steps:
      - uses: actions/checkout@v4
      - run: sh -n run.sh
      - run: python3 -m json.tool automaton.json > /dev/null
