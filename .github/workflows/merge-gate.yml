name: Merge gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge-gate:
    name: merge-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The gate comes from the base branch, so a pull request cannot loosen its own gate.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      # Check only: never --merge. The other checks are required by branch protection, so --skip-ci.
      - name: Run merge-gate.py
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f .agents/tools/merge-gate.py ]; then
            echo "The base branch has no merge-gate.py yet; nothing to check."
            exit 0
          fi
          python3 .agents/tools/merge-gate.py "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --skip-ci
