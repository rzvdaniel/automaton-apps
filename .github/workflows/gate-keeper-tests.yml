name: Gate Keeper tests

on:
  pull_request:
    paths:
      - 'maintenance/gate-keeper/**'
      - 'design/automaton-app-ui/**'
      - '.github/workflows/gate-keeper-tests.yml'
  push:
    paths:
      - 'maintenance/gate-keeper/**'
      - 'design/automaton-app-ui/**'
      - '.github/workflows/gate-keeper-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maintenance/gate-keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema
      - run: python -m unittest discover -p 'test_*.py'
      - run: python ../../tools/check_vendored_ui.py
      - run: python -m unittest discover -p 'test_*.py'
        working-directory: maintenance/gate-keeper/actions/home-card
