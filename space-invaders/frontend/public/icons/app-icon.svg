<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Space Invaders Green Alien App Icon</title>
  <desc id="desc">A professional pixel-style green alien icon for a Space Invaders web game.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1B2B6F"/>
      <stop offset="48%" stop-color="#10183F"/>
      <stop offset="100%" stop-color="#070A18"/>
    </radialGradient>
    <linearGradient id="alien" x1="256" y1="148" x2="256" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8FF7A"/>
      <stop offset="100%" stop-color="#25D96B"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.23 0 0 0 0 0.86 0 0 0 0 1 0 0 0 0.45 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundClip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundClip)">
    <rect width="512" height="512" rx="112" fill="url(#bg)"/>

    <!-- subtle orbital rings from the original icon -->
    <path d="M-38 349C91 274 251 253 550 295" stroke="#4267FF" stroke-opacity="0.16" stroke-width="10"/>
    <path d="M-26 385C125 312 291 303 546 352" stroke="#67E8F9" stroke-opacity="0.12" stroke-width="7"/>

    <!-- stars, intentionally large enough for favicon readability -->
    <circle cx="112" cy="115" r="7" fill="#DFF7FF" opacity="0.9"/>
    <circle cx="386" cy="102" r="5" fill="#DFF7FF" opacity="0.7"/>
    <circle cx="421" cy="226" r="6" fill="#DFF7FF" opacity="0.75"/>
    <circle cx="82" cy="263" r="5" fill="#DFF7FF" opacity="0.65"/>

    <!-- centered green alien from the original icon, enlarged for app-icon readability -->
    <g filter="url(#softGlow)" transform="translate(256 256) scale(1.48) translate(-256 -184.5)">
      <path fill="url(#alien)" d="M181 142h28v-28h28v28h38v-28h28v28h28v28h29v57h-29v28h-28v-28h-94v28h-28v-28h-29v-57h29v-28Zm28 28v29h29v-29h-29Zm65 0v29h29v-29h-29Z"/>
      <path d="M209 170h29v29h-29v-29Zm65 0h29v29h-29v-29Z" fill="#07101F" opacity="0.92"/>
    </g>

    <!-- inner border for polished app-icon look -->
    <rect x="8" y="8" width="496" height="496" rx="104" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="16"/>
  </g>
</svg>
