<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12a5c6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Harbour</title>
<meta name="description" content="A living harbour island for your desktop. Click anything.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="ui/app.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #12a5c6; }
  /* the app handles every gesture itself: no page scroll, no browser pinch-zoom, no double-tap zoom, no text selection */
  body { touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .btn { position: fixed; right: max(12px, env(safe-area-inset-right)); width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; touch-action: manipulation;
    background: rgba(255, 255, 255, 0.26); color: #fff; opacity: 0.8; transition: opacity 0.2s, background 0.2s, transform 0.2s; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .btn:hover, .btn:focus-visible { opacity: 1; background: rgba(255, 255, 255, 0.38); outline: none; }
  .btn svg { width: 24px; height: 24px; display: block; margin: auto; }
  #settings { top: max(12px, env(safe-area-inset-top)); }
  #home { top: calc(max(12px, env(safe-area-inset-top)) + 54px); transform: scale(0.6); opacity: 0; pointer-events: none; }
  body.zoomed #home { transform: none; opacity: 0.8; pointer-events: auto; }
  /* the settings dialog: the kit's card and form classes, only laid out here; colours come from the kit's tokens */
  .settings-dialog { padding: 0; border: 0; background: transparent; color: var(--text); width: min(360px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; touch-action: pan-y; user-select: none; }
  .settings-dialog::backdrop { background: color-mix(in srgb, var(--ink) 40%, transparent); }
  .settings-dialog .a-card { box-shadow: 0 12px 40px color-mix(in srgb, var(--ink) 35%, transparent); }
  .settings-dialog .a-card__head { margin: 0; }
  .settings-dialog #set-sound svg { width: 20px; height: 20px; flex: none; }
  .settings-dialog #set-sound .waves { display: none; } .settings-dialog #set-sound.on .waves { display: inline; } .settings-dialog #set-sound.on .cross { display: none; }
  .settings-dialog .slider { width: 100%; accent-color: var(--accent); min-height: 28px; margin: 0; }
  .settings-dialog .slider-ends { display: flex; justify-content: space-between; }
  .settings-dialog .dialog-actions { display: flex; justify-content: flex-end; }
</style>
</head>
<body>
<div id="stage"></div>
<button id="settings" class="btn" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
  </svg>
</button>
<button id="home" class="btn" type="button" aria-label="Reset zoom" title="Reset zoom">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg>
</button>
<script type="module" src="js/main.js"></script>
</body>
</html>
