<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbour</title>
<meta name="description" content="A living harbour island for your desktop. Click anything.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #12a5c6; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #sound { position: fixed; top: 14px; right: 14px; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    background: rgba(255, 255, 255, 0.26); color: #fff; opacity: 0.75; transition: opacity 0.2s, background 0.2s; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #sound:hover, #sound:focus-visible { opacity: 1; background: rgba(255, 255, 255, 0.38); outline: none; }
  #sound svg { width: 20px; height: 20px; display: block; margin: auto; }
  #sound .waves { display: none; } #sound.on .waves { display: inline; } #sound.on .cross { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<button id="sound" type="button" aria-label="Sound" aria-pressed="false" title="Sound">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3l4.5-4v13l-4.5-4H4z" fill="currentColor"/>
    <path class="waves" d="M15 9.2a4 4 0 0 1 0 5.6M17.6 6.6a7.6 7.6 0 0 1 0 10.8"/>
    <path class="cross" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/>
  </svg>
</button>
