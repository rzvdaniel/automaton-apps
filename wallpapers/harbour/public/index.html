<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12a5c6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Harbour</title>
<meta name="description" content="A living harbour island for your desktop. Click anything.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="ui/app.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #12a5c6; }
  /* the app handles every gesture itself: no page scroll, no browser pinch-zoom, no double-tap zoom, no text selection */
  body { touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .btn { position: fixed; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; touch-action: manipulation;
    background: rgba(255, 255, 255, 0.26); color: #fff; opacity: 0.8; transition: opacity 0.2s, background 0.2s, transform 0.2s; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .btn:hover, .btn:focus-visible { opacity: 1; background: rgba(255, 255, 255, 0.38); outline: none; }
  .btn svg { width: 24px; height: 24px; display: block; margin: auto; }
  /* the settings button: 10 px from the right edge and 72 px up, above a desktop taskbar (as a wallpaper the page runs behind
     it; a Windows taskbar is 48 px). Reset zoom sits in the top-right corner, which the panel never reaches. */
  :root { --settings-bottom: max(72px, env(safe-area-inset-bottom)); }
  #settings { right: max(10px, env(safe-area-inset-right)); bottom: var(--settings-bottom); z-index: 6; }
  #home { right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); transform: scale(0.6); opacity: 0; pointer-events: none; }
  body.zoomed #home { transform: none; opacity: 0.8; pointer-events: auto; }
  /* the settings panel: the kit's card and form classes, only laid out here; colours come from the kit's tokens.
     Above the button, 10 px from the right edge, scrolls when taller than the space (the top 76 px stay free for Reset zoom). */
  .settings-panel { position: fixed; z-index: 5; right: max(10px, env(safe-area-inset-right)); bottom: calc(var(--settings-bottom) + 54px);
    width: 340px; max-width: calc(100vw - 20px); box-sizing: border-box; max-height: calc(100dvh - 192px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow: auto; overscroll-behavior: contain;
    touch-action: pan-y; user-select: none; background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 12px 40px color-mix(in srgb, var(--ink) 30%, transparent); }
  .settings-panel[hidden] { display: none; }
  .settings-panel .a-card__head { margin: 0 0 10px; }
  .settings-panel .a-label output { float: right; font-variant-numeric: tabular-nums; }
  .settings-panel .slider { width: 100%; accent-color: var(--accent); min-height: 28px; margin: 0; }
  .settings-panel .slider-ends { display: flex; justify-content: space-between; }
  .settings-panel .a-btn svg { width: 18px; height: 18px; display: block; }
  .settings-panel .time-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .settings-panel .set-status { margin: 4px 0 0; font: 11px/1.35 Consolas, monospace; color: var(--muted); white-space: pre-wrap; user-select: text; }
  /* a row of round buttons: about 44 px each, the chosen one filled with the accent */
  .icon-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .icon-btn { width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; display: grid; place-items: center; touch-action: manipulation; transition: background 0.15s, color 0.15s, border-color 0.15s; }
  .icon-btn svg { width: 24px; height: 24px; display: block; }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .icon-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text, #fff); }
  .icon-btn--text { width: auto; min-width: 44px; padding: 0 14px; border-radius: 22px; font: inherit; font-size: 13px; font-weight: 600; }
  /* a phone-width screen: a sheet across the bottom, over the corner button (the sheet has its own close button) */
  @media (max-width: 639px) {
    .settings-panel { z-index: 7; left: 0; right: 0; bottom: 0; width: auto; max-width: none; border-radius: 16px 16px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom));
      max-height: min(75dvh, calc(100dvh - 76px - env(safe-area-inset-top))); }
  }
</style>
</head>
<body>
<div id="stage"></div>
<button id="settings" class="btn" type="button" aria-label="Settings" title="Settings" aria-controls="settings-panel" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
  </svg>
</button>
<button id="home" class="btn" type="button" aria-label="Reset zoom" title="Reset zoom">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg>
</button>
<script type="module" src="js/main.js"></script>
</body>
</html>
