<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbour gallery</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; padding: 18px; background: #0f2a3a; color: #eaf2f5; font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; } p { margin: 0 0 14px; color: #9fc0cc; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  figure { margin: 0; background: #163a4d; border-radius: 10px; overflow: hidden; }
  canvas { display: block; width: 100%; aspect-ratio: 4 / 3; cursor: pointer; }
  figcaption { padding: 8px 12px 10px; } figcaption b { display: block; } figcaption span { color: #a9c7d2; font-size: 13px; }
  code { color: #ffe9a3; }
</style>
</head>
<body>
<h1>Harbour gallery</h1>
<p>Every extra element, drawn large and alive. Click one to see its reaction. The class name is what goes into <code>island/extras.js</code>.</p>
<div id="grid"></div>
<script type="module" src="js/gallery.js"></script>
</body>
</html>
