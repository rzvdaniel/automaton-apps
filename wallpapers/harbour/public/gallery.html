<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbour gallery</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; padding: 18px; background: #0f2a3a; color: #eaf2f5; font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; } p { margin: 0 0 14px; color: #9fc0cc; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  figure { margin: 0; background: #163a4d; border-radius: 10px; overflow: hidden; }
  canvas { display: block; width: 100%; aspect-ratio: 4 / 3; cursor: pointer; }
  figcaption { padding: 8px 12px 10px; } figcaption b { display: block; } figcaption span { color: #a9c7d2; font-size: 13px; }
  code { color: #ffe9a3; }
</style>
</head>
<body>
<h1>Harbour gallery</h1>
<p>Every extra element, drawn large and alive. Click one to see its reaction. The class name is what goes into <code>island.js</code>.</p>
<div id="grid"></div>
<script src="js/core.js"></script>
<script src="js/shader.js"></script>
<script src="js/world.js"></script>
<script src="js/entities/house.js"></script>
<script src="js/entities/smoke.js"></script>
<script src="js/entities/people.js"></script>
<script src="js/entities/boats.js"></script>
<script src="js/entities/whale.js"></script>
<script src="js/entities/seal.js"></script>
<script src="js/entities/balloon.js"></script>
<script src="js/entities/biplane.js"></script>
<script src="js/entities/dolphins.js"></script>
<script src="js/entities/currach.js"></script>
<script src="js/entities/puffin.js"></script>
<script src="js/entities/cow.js"></script>
<script src="js/entities/dolmen.js"></script>
<script src="js/entities/cottage.js"></script>
<script src="js/entities/kite.js"></script>
<script src="js/entities/buoy.js"></script>
<script src="js/entities/jellyfish.js"></script>
<script>
(function (H) {
  'use strict';
  const SEA = '#17a3cb', DEEP = '#0f7fb0', GRASS = '#93c96b', SAND = '#efe3c9';
  // A stand-in for the real world: just enough for one entity to live in a frame of its own.
  class Stage {
    constructor(kind) { this.kind = kind; this.clock = 0; this.wind = [0.9, 0.2]; this.hw = this.hh = 6; this.mouse = { x: 0, y: 0, on: false }; this.entities = []; this.particles = []; this.ripples = []; this.rings = []; this.map = { roads: [], path: [], cells: [] }; this.sound = new Proxy({}, { get: () => () => {} }); }
    field(x, y) { return this.kind === 'sea' ? 1 : this.kind === 'land' ? -1 : x; }          // 'shore': land on the left, sea on the right
    grad(x, y) { return { d: this.field(x, y), gx: this.kind === 'shore' ? 1 : 0, gy: this.kind === 'shore' ? 0 : -1 }; }
    pushIn(p) { return p; }
    sway(x, y) { return H.World.prototype.sway.call(this, x, y); }
    add(e) { this.entities.push(e); return e; }
    all(cls) { return this.entities.filter(e => e instanceof cls); }
    count(cls) { return this.all(cls).length; }
    ripple(x, y, k) { this.ripples.push({ x: x, y: y, t: 0, k: k }); }
    burst() { H.World.prototype.burst.apply(this, arguments); }
    ring(x, y, delay) { this.rings.push({ x: x, y: y, t: -delay }); }
    scare() {}
  }
  const R = Math.random;
  // title, class, note, where it lives, pixels per world unit at a 400px-wide frame, how to make it
  const SHOW = [
    ['Whale', 'Whale', 'Already in the scene, repainted. A humpback, sometimes with a calf; she blows when she surfaces.', 'sea', 1500, w => { const e = new H.Whale(w, R); e.cross(0, 0, 1, 0.15); e.calf = true; e.alpha = 1; e.blow = 2; e.at = 1e9; return e; }, DEEP],
    ['Seal', 'Seal', 'Basks on rock or sand. Click: it wriggles to the sea, swims, then comes home.', 'shore', 6200, w => { w.add(new H.Seal(w, { x: -0.022, y: 0.012, a: 2.6, kind: 'pup' })); w.add(new H.Seal(w, { x: -0.03, y: -0.012, a: 0.5, kind: 'brown' })); return new H.Seal(w, { x: -0.012, y: 0, a: -0.3, kind: 'grey' }); }, null, true],
    ['Hot-air balloon', 'Balloon', 'Drifts on the wind above everything. Click: the burner fires and it climbs.', 'land', 2600, w => new H.Balloon(w, { x: 0, y: 0 }), GRASS],
    ['Biplane', 'Biplane', 'Tours the island, banking into turns. Click: a barrel roll with smoke.', 'land', 3300, w => new H.Biplane(w, { x: 0, y: 0, a: -0.3 }), GRASS],
    ['Dolphins', 'DolphinPod', 'A pod in deep water; they leap in turn. Click: they all leap.', 'sea', 2700, w => new H.DolphinPod(w, { x: 0, y: 0, a: -0.2, count: 4 }), DEEP],
    ['Currach', 'Currach', 'A tarred rowing boat with a rower, leaving oar puddles. Click: he pulls harder.', 'sea', 7000, w => new H.Currach(w, { x: 0, y: 0, a: -0.25 }), SEA],
    ['Puffin', 'Puffin', 'Stands on the cliffs. Click: it whirrs out to sea and back.', 'shore', 9000, w => { w.add(new H.Puffin(w, { x: -0.011, y: 0.003, flip: true })); return new H.Puffin(w, { x: 0.003, y: 0 }); }, null, true],
    ['Cow', 'Cow', 'Grazes around its spot. Click: it trots off. Three coats.', 'land', 7200, w => { w.add(new H.Cow(w, { x: -0.017, y: -0.011, a: 2.4, kind: 'red' })); w.add(new H.Cow(w, { x: 0.017, y: 0.012, a: -0.6, kind: 'kerry' })); return new H.Cow(w, { x: 0, y: 0, a: 0.4, kind: 'friesian' }); }, GRASS, true],
    ['Dolmen', 'Dolmen', 'An ancient portal tomb in the meadow. Click: something stirs.', 'land', 7000, w => new H.Dolmen(w, { x: 0, y: 0.004 }), GRASS, true],
    ['Thatched cottage', 'Cottage', 'A whitewashed cottage under thatch; takes the place of any house.', 'land', 7500, w => new H.Cottage(w, { x: 0, y: 0, a: 0.12, w: 0.034, smoke: true }), GRASS, true],
    ['Kite', 'Kite', 'A child on the grass flying a kite in the wind. Click the kite: it loops.', 'land', 3300, w => new H.Kite(w, { x: -0.04, y: 0.022 }), GRASS, true],
    ['Buoy', 'Buoy', 'A red marker rocking on the swell, lamp blinking. Click: it rocks hard.', 'sea', 14000, w => new H.Buoy(w, { x: 0, y: 0.003 }), SEA, true],
    ['Jellyfish', 'JellyBloom', 'A bloom of moon jellies pulsing under the surface; they shy from a click.', 'sea', 5200, w => new H.JellyBloom(w, { x: 0, y: 0, count: 7 }), DEEP, true]
  ];
  const cells = [];
  SHOW.forEach(s => {
    if (!H[s[1]]) return;
    const fig = document.createElement('figure'), cv = document.createElement('canvas');
    fig.appendChild(cv); fig.insertAdjacentHTML('beforeend', '<figcaption><b>' + s[0] + ' <code>' + s[1] + '</code></b><span>' + s[2] + '</span></figcaption>');
    document.getElementById('grid').appendChild(fig);
    const w = new Stage(s[3]), main = w.add(s[5](w));
    const cell = { cv: cv, c: cv.getContext('2d'), w: w, main: main, zoom: s[4], bg: s[6], fixed: s[7], cam: [0, 0] };
    cv.addEventListener('click', ev => {
      const r = cv.getBoundingClientRect(), k = cell.zoom * r.width / 400, x = (ev.clientX - r.left - r.width / 2) / k + cell.cam[0], y = (ev.clientY - r.top - r.height / 2) / k + cell.cam[1];
      let hit = false; w.entities.forEach(e => { if (e.constructor.clicks && e.hit(x, y)) { e.click(x, y); hit = true; } });
      if (!hit) main.click(main.x, main.y);
      if (w.field(x, y) > 0) w.ripple(x, y, 1);
    });
    cells.push(cell);
  });
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    cells.forEach(cell => {
      const cv = cell.cv, c = cell.c, w = cell.w, r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
      if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
      w.clock += dt; w.entities.forEach(e => e.update(dt)); w.entities = w.entities.filter(e => !e.dead);
      if (!cell.fixed) cell.cam = [cell.main.x, cell.main.y];
      [w.ripples, w.rings].forEach(list => { for (let i = list.length - 1; i >= 0; i--) { list[i].t += dt; if (list[i].t > 2.8) list.splice(i, 1); } });
      for (let i = w.particles.length - 1; i >= 0; i--) { const p = w.particles[i]; p.life -= dt; if (p.life <= 0) { w.particles.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; }
      const k = cell.zoom * cv.width / 400;
      c.setTransform(1, 0, 0, 1, 0, 0);
      if (cell.bg) { c.fillStyle = cell.bg; c.fillRect(0, 0, cv.width, cv.height); }
      else { const edge = cv.width / 2 - cell.cam[0] * k; c.fillStyle = SAND; c.fillRect(0, 0, edge, cv.height); c.fillStyle = SEA; c.fillRect(edge, 0, cv.width, cv.height); c.fillStyle = 'rgba(255,255,255,0.7)'; c.fillRect(edge - 3, 0, 6, cv.height); }
      c.setTransform(k, 0, 0, k, cv.width / 2 - cell.cam[0] * k, cv.height / 2 - cell.cam[1] * k);
      c.lineCap = 'round'; c.lineJoin = 'round';
      w.ripples.forEach(p => { const u = p.t / 2.8; c.strokeStyle = 'rgba(255,255,255,' + (0.6 * p.k * (1 - u) * (1 - u)) + ')'; c.lineWidth = 0.0012; c.beginPath(); c.arc(p.x, p.y, 0.004 + 0.06 * Math.pow(u, 0.75) * (0.5 + 0.5 * p.k), 0, H.TAU); c.stroke(); });
      const sorted = w.entities.slice().sort((p, q) => p.y - q.y);
      H.LAYERS.forEach(layer => {
        if (layer === 'effects') {
          w.rings.forEach(p => { if (p.t < 0 || p.t > 1.6) return; c.strokeStyle = 'rgba(255,246,200,' + (0.7 * (1 - p.t / 1.6)) + ')'; c.lineWidth = 0.0012; c.beginPath(); c.arc(p.x, p.y, 0.006 + p.t * 0.03, 0, H.TAU); c.stroke(); });
          w.particles.forEach(p => H.disc(c, p.x, p.y, p.r, 'rgba(' + p.col + ',' + (0.85 * p.life / p.max) + ')'));
        }
        sorted.forEach(e => { const m = e.constructor.passes[layer]; if (m) e[m](c, w.clock); });
      });
    });
  }
  requestAnimationFrame(frame);
})(window.Harbour);
</script>
</body>
</html>
